# Portable workflow: this component directory must be the repository root.
name: snippet checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: component-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CI: 'true'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency vulnerability check
        run: npm audit --audit-level=moderate --package-lock-only
      - name: Type check
        run: npm run check
      - name: Build every bundle and assert its budget
        # build.mjs enforces the emitted bundle budgets and cookie-mode
        # separation; a budget change requires a specification change first.
        run: npm run build
      - name: Source boundaries
        run: npm run test:source
      - uses: actions/upload-artifact@v7
        with:
          name: snippet-bundles
          path: dist/
          if-no-files-found: error
          retention-days: 14

  browser:
    # spec/snippet.md §4 runs in a real browser against the contracts mock
    # server, so it needs a published contracts archive. That download is not
    # configured yet, so this job waits on the repository variables rather than
    # pretending to run: set JELTO_CONTRACTS_ARCHIVE_URL and
    # JELTO_CONTRACTS_ARCHIVE_SHA256 to activate it. CONTRIBUTING.md covers
    # running the suite locally with JELTO_CONTRACTS_DIR.
    #
    # Both variables gate the job. A URL without its checksum must not start it:
    # `sha256sum -c` treats a line with an empty digest as improperly formatted
    # and still exits 0, so a half-configured job would install unverified bytes.
    if: vars.JELTO_CONTRACTS_ARCHIVE_URL != '' && vars.JELTO_CONTRACTS_ARCHIVE_SHA256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
      - name: Install the pinned contracts archive
        env:
          ARCHIVE_URL: ${{ vars.JELTO_CONTRACTS_ARCHIVE_URL }}
          ARCHIVE_SHA256: ${{ vars.JELTO_CONTRACTS_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail
          # The job condition already requires both; --strict is the second lock
          # on the same door. Without it an empty digest is merely "improperly
          # formatted" and sha256sum still exits 0, installing unverified bytes.
          curl -fsSL "$ARCHIVE_URL" -o contracts.zip
          echo "$ARCHIVE_SHA256  contracts.zip" | sha256sum -c --strict -
          # The archive is flat -- spec/, go.mod and the conformance tools sit at
          # its top level -- so this directory is JELTO_CONTRACTS_DIR as it is.
          unzip -q contracts.zip -d "$RUNNER_TEMP/contracts"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Browser and timing contracts
        env:
          JELTO_CONTRACTS_DIR: ${{ runner.temp }}/contracts
        run: npm test

  publish:
    name: Publish package
    # Backend CI contract §8: the producer publishes its own package after this
    # push's checks pass on main. The pair is built from the artifact the checks
    # uploaded, so what was tested is what ships.
    needs: [checks, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Build provenance for the pushed digest (public repository).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: snippet-bundles
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: oras-project/setup-oras@v2
        with:
          version: '1.3.3'
      - name: Sign in to the organization registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the component package
        id: package
        # component-package.json names what the archive holds; the version comes
        # from package.json. An existing version is reused only when it is
        # byte-identical; a collision fails, so changed content needs a new version.
        env:
          PRODUCER_COMMIT: ${{ github.sha }}
        run: python3 vendor/package-tools/package_component.py --commit "$PRODUCER_COMMIT" --out "$RUNNER_TEMP/package" publish
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.package.outputs.name }}
          subject-digest: ${{ steps.package.outputs.digest }}
          push-to-registry: true
          # The attestation is what the backend verifies; the org has no
          # artifact-metadata storage, so the optional record is not attempted.
          create-storage-record: false
